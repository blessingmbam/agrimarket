{% extends 'base.html' %}{% import '_m.html' as m with context %}{% block body %}<h1>Categories</h1>{% include 'admin/_tabs.html' %}
<form method="post" class="row">{{ m.csrf() }}<input type="hidden" name="action" value="add"><input name="name" placeholder="New category" required aria-label="Category name"><select name="kind" aria-label="Kind"><option>crop</option><option>livestock</option><option>dairy</option><option>other</option></select><button class="btn sm">Add category</button></form>
{% for c in cats %}<form method="post" class="row between panel">{{ m.csrf() }}<input type="hidden" name="action" value="del"><input type="hidden" name="id" value="{{ c.id }}"><span>{{ c.name }} <span class="muted">{{ c.kind }}</span></span><button class="link danger">Delete</button></form>{% endfor %}{% endblock %}
